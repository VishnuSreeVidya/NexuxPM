$kind: http-request
description: ""
url: "{{baseUrl}}/projects/:project_id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: project_id
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "Project Id",
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "name": "string",
      "description": null,
      "leadId": null,
      "priority": null,
      "startDate": "2002-02-26",
      "endDate": null,
      "status": null,
      "teamLeaderIds": null
    }
  $type: |-
    {
      "title": "ProjectUpdate",
      "type": "object",
      "properties": {
        "name": {
          "title": "Name",
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 80
            },
            {
              "type": "null"
            }
          ]
        },
        "description": {
          "title": "Description",
          "anyOf": [
            {
              "type": "string",
              "maxLength": 500
            },
            {
              "type": "null"
            }
          ]
        },
        "leadId": {
          "title": "Leadid",
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 50
            },
            {
              "type": "null"
            }
          ]
        },
        "priority": {
          "title": "Priority",
          "anyOf": [
            {
              "type": "string",
              "enum": [
                "low",
                "medium",
                "high",
                "critical"
              ]
            },
            {
              "type": "null"
            }
          ]
        },
        "startDate": {
          "title": "Startdate",
          "anyOf": [
            {
              "type": "string",
              "format": "date"
            },
            {
              "type": "null"
            }
          ]
        },
        "endDate": {
          "title": "Enddate",
          "anyOf": [
            {
              "type": "string",
              "format": "date"
            },
            {
              "type": "null"
            }
          ]
        },
        "status": {
          "title": "Status",
          "anyOf": [
            {
              "type": "string",
              "enum": [
                "planning",
                "active",
                "on_hold",
                "completed"
              ]
            },
            {
              "type": "null"
            }
          ]
        },
        "teamLeaderIds": {
          "title": "Teamleaderids",
          "anyOf": [
            {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "additionalProperties": false
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Update Project.resources/examples
order: 2000
