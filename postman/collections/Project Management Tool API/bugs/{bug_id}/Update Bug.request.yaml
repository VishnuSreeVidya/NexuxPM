$kind: http-request
description: ""
url: "{{baseUrl}}/bugs/:bug_id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: bug_id
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "Bug Id",
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "status": "fixed"
    }
  $type: |-
    {
      "title": "BugUpdate",
      "type": "object",
      "properties": {
        "status": {
          "type": "string",
          "enum": [
            "open",
            "in_progress",
            "fixed",
            "verified",
            "reopened"
          ],
          "title": "Status"
        }
      },
      "required": [
        "status"
      ],
      "additionalProperties": false
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Update Bug.resources/examples
order: 2000
